name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest (locked version, binary-only)
        run: "pip install --only-binary :all: pytest==9.1.1"
      - name: Run tests
        run: python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check (all scripts stdlib-only, no deps)
        run: |
          python -m py_compile scripts/capture_raw.py scripts/verify_raw.py
          python scripts/capture_raw.py --help > /dev/null
          python scripts/verify_raw.py --help > /dev/null
